{% extends 'base.html' %}
{% block title %}Painel de Carros{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Painel de Carros Registrados</h2>
    </div>
    <div class="card-body">
        <form method="GET" action="{{ url_for('car_dashboard') }}" class="mb-4">
            <div class="input-group">
                <input type="text" name="search" class="form-control" placeholder="Buscar por nome do proprietário ou placa..." value="{{ search }}">
                <button type="submit" class="btn btn-outline-secondary">Buscar</button>
            </div>
        </form>

        {% if table %}
            {{ table|safe }}
        {% else %}
            <p class="text-center">Nenhum carro encontrado.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
